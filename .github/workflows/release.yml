name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v1.1.0'
        required: true

permissions:
  contents: write
  # Required for Visual Studio Marketplace Trusted Publishing (OIDC)
  id-token: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: ${{ env.TAG }}

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

    - name: Verify tag matches package.json version
      run: |
        PKG_VERSION=$(node -p "require('./package.json').version")
        if [ "$PKG_VERSION" != "${{ steps.get_version.outputs.VERSION }}" ]; then
          echo "Tag $TAG does not match package.json version $PKG_VERSION"
          exit 1
        fi

    - name: Package extension
      run: npx --yes @vscode/vsce@4.1.0 package

    - name: Build release notes
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        # Extract the section for this version from CHANGELOG.md
        awk -v v="$VERSION" '
          $0 ~ "^## \\[" v "\\]" { found=1; next }
          found && /^## \[/ { exit }
          found { print }
        ' CHANGELOG.md > notes.md
        cat >> notes.md <<EOF

        ## Installation

        - **VS Code**: install from the [Visual Studio Marketplace](https://marketplace.visualstudio.com/items?itemName=ottojimb.quickchars)
        - **Cursor, VSCodium, Windsurf and other forks**: install from [Open VSX](https://open-vsx.org/extension/ottojimb/quickchars)
        - **Manual**: download \`quickchars-${VERSION}.vsix\`, open the Extensions view, click "..." and select "Install from VSIX..."

        ## Compatibility

        - VS Code: ^1.95.0
        - Cursor IDE: Compatible
        EOF

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists, skipping"
        else
          gh release create "$TAG" \
            "quickchars-${VERSION}.vsix" \
            --title "QuickChars v${VERSION}" \
            --notes-file notes.md \
            --verify-tag
        fi

    - name: Publish to Visual Studio Marketplace
      # Uses Trusted Publishing: the Marketplace publisher must have a policy for this repo and workflow file.
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath "quickchars-${VERSION}.vsix" --skip-duplicate

    - name: Publish to Open VSX
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        if [ -z "$OVSX_PAT" ]; then
          echo "::warning::OVSX_PAT secret is not set, skipping Open VSX"
          exit 0
        fi
        npx --yes ovsx publish --packagePath "quickchars-${VERSION}.vsix" --pat "$OVSX_PAT" --skip-duplicate
