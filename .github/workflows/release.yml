name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Verify tag matches package.json version
      run: |
        PKG_VERSION=$(node -p "require('./package.json').version")
        if [ "$PKG_VERSION" != "${{ steps.get_version.outputs.VERSION }}" ]; then
          echo "Tag v${{ steps.get_version.outputs.VERSION }} does not match package.json version $PKG_VERSION"
          exit 1
        fi

    - name: Package extension
      run: npx --yes @vscode/vsce package

    - name: Build release notes
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        # Extract the section for this version from CHANGELOG.md
        awk -v v="$VERSION" '
          $0 ~ "^## \\[" v "\\]" { found=1; next }
          found && /^## \[/ { exit }
          found { print }
        ' CHANGELOG.md > notes.md
        cat >> notes.md <<EOF

        ## Installation

        1. Download the \`quickchars-${VERSION}.vsix\` file
        2. In VS Code/Cursor, go to Extensions view (Ctrl+Shift+X)
        3. Click the "..." menu and select "Install from VSIX..."
        4. Select the downloaded file

        ## Compatibility

        - VS Code: ^1.95.0
        - Cursor IDE: Compatible
        EOF

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          "quickchars-${VERSION}.vsix" \
          --title "QuickChars v${VERSION}" \
          --notes-file notes.md \
          --verify-tag
