<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Source of icon.png. Render with: rsvg-convert -w 256 -h 256 assets/quickchars.svg -o icon.png (needs Noto Sans fonts) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EAF6"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <g font-family="Noto Sans" font-weight="900" text-anchor="middle">
    <!-- top-left: Omega -->
    <rect x="34" y="40" width="88" height="88" rx="20" fill="#1B1840" opacity="0.55"/>
    <rect x="34" y="32" width="88" height="88" rx="20" fill="url(#cap)"/>
    <text x="78" y="98" font-size="62" fill="#4338CA">Ω</text>
    <!-- top-right: ñ -->
    <rect x="134" y="40" width="88" height="88" rx="20" fill="#1B1840" opacity="0.55"/>
    <rect x="134" y="32" width="88" height="88" rx="20" fill="url(#cap)"/>
    <text x="178" y="98" font-size="62" fill="#E11D48">ñ</text>
    <!-- bottom-left: braces (snippet) -->
    <rect x="34" y="140" width="88" height="88" rx="20" fill="#1B1840" opacity="0.55"/>
    <rect x="34" y="132" width="88" height="88" rx="20" fill="url(#cap)"/>
    <text x="78" y="196" font-size="54" font-family="Noto Sans Mono" font-weight="700" fill="#0D9488">{}</text>
    <!-- bottom-right: pressed key with arrow -->
    <rect x="134" y="140" width="88" height="88" rx="20" fill="#92400E" opacity="0.7"/>
    <rect x="134" y="136" width="88" height="88" rx="20" fill="url(#hot)"/>
    <path d="M154 180 H196 M182 164 L198 180 L182 196" fill="none" stroke="#1E1B4B" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
